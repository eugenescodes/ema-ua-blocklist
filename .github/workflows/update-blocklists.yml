name: Update blocklists

permissions:
  contents: read

concurrency:
  group: update-blocklists-main
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-update-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-update-

      - name: Generate and validate blocklists
        run: |
          cargo run --release --locked
          cargo run --release --locked -- --validate .

      - name: Commit and push updated blocklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts_ema.txt hosts_ema_ublock.txt
          if git diff --cached --quiet; then
            echo "Generated blocklists are unchanged."
            exit 0
          fi
          git commit -m "Update generated blocklists"
          git push origin HEAD:main
